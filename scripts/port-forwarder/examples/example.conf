# 🌐 端口转发配置示例

# Web服务器转发
# 将本地8080端口转发到局域网Web服务器
RULE_NAME="web-server"
LOCAL_PORT="8080"
TARGET_HOST="192.168.1.100"
TARGET_PORT="80"
METHOD="socat"
DESCRIPTION="局域网Web服务器转发"
CREATED_AT="2025-09-01 10:00:00"

# 常用转发配置示例:

# 1. HTTP服务转发
# 本地8080 -> 192.168.1.100:80
# ./port-forwarder.sh add http-server -l 8080 -h 192.168.1.100 -p 80 -d "HTTP服务器"

# 2. HTTPS服务转发  
# 本地8443 -> 192.168.1.100:443
# ./port-forwarder.sh add https-server -l 8443 -h 192.168.1.100 -p 443 -d "HTTPS服务器"

# 3. 数据库转发
# 本地3306 -> 192.168.1.200:3306
# ./port-forwarder.sh add mysql-db -l 3306 -h 192.168.1.200 -p 3306 -d "MySQL数据库"

# 4. SSH服务转发
# 本地2222 -> 192.168.1.50:22
# ./port-forwarder.sh add ssh-server -l 2222 -h 192.168.1.50 -p 22 -d "SSH服务器"

# 5. Redis转发
# 本地6379 -> 192.168.1.150:6379
# ./port-forwarder.sh add redis-cache -l 6379 -h 192.168.1.150 -p 6379 -d "Redis缓存"

# 6. 开发API转发
# 本地3000 -> 192.168.1.120:8000
# ./port-forwarder.sh add dev-api -l 3000 -h 192.168.1.120 -p 8000 -d "开发API服务器"
